name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Generate License Report
        run: ./gradlew generateLicenseReport --no-daemon --stacktrace
        continue-on-error: true

      - name: Compile Test Classes
        run: ./gradlew compileTestKotlin --no-daemon --stacktrace
        continue-on-error: true

      - name: Run Unit Tests
        run: ./gradlew :app:test --no-daemon --stacktrace --continue --info

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          retention-days: 7

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run Lint
        run: ./gradlew lint --no-daemon --stacktrace
        continue-on-error: true

      - name: Upload Lint Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: app/build/reports/lint-results.html
          retention-days: 7

  instrumented-test:
    name: Instrumented Tests (Emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [test, lint]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: latest
          packages: platform-tools platforms;android-34 build-tools;34.0.0 system-images;android-34;default;x86_64

      - name: Accept SDK Licenses
        run: yes | sdkmanager --licenses

      - name: Add Android SDK to PATH
        run: echo "$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Create and Start Emulator
        run: |
          export ANDROID_AVD_HOME=$HOME/.android/avd
          echo "no" | avdmanager create avd -n test -k "system-images;android-34;default;x86_64" --force
          emulator -avd test -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect &
          # Wait for emulator to boot
          adb wait-for-device shell 'while [[ -z $(getprop sys.boot_completed) ]]; do sleep 1; done'
          adb shell input keyevent 82

      - name: Run Instrumented Tests
        run: ./gradlew connectedDebugAndroidTest --no-daemon --stacktrace

      - name: Upload Instrumented Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 7

  assemble:
    name: Assemble Debug
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [test, lint, instrumented-test]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Generate License Report
        run: ./gradlew generateLicenseReport --no-daemon --stacktrace
        continue-on-error: true

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7